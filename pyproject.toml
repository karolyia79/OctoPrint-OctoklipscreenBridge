[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoklipscreenBridge"
version = "0.4.2"
description = "OctoPrint plugin to send serial logs via MQTT to CYD display"
readme = "README.md"
license = {text = "AGPLv3"}
authors = [
    {name = "Károlyi András"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Natural Language :: Hungarian",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.7"
dependencies = [
    "paho-mqtt>=1.5.0,<3.0"
]

[project.urls]
Homepage = "https://github.com/karolyia79/OctoklipscreenBridge"
Repository = "https://github.com/karolyia79/OctoklipscreenBridge.git"
Issues = "https://github.com/karolyia79/OctoklipscreenBridge/issues"

[tool.setuptools]
packages = ["octoklipscreen_bridge"]
include-package-data = true

[tool.setuptools.package-data]
octoklipscreen_bridge = [
    "templates/*.html",
    "static/**/*",
]
